when:
  event: tag

steps:
  - name: test
    image: golang:1.27-alpine
    commands:
      - go test ./...
      - go vet ./...

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:5.2.2
    settings:
      registry: ${GITTAN_REGISTRY}
      repo: ${GITTAN_IMAGE_REPO}
      tags: ${CI_COMMIT_TAG}
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64
      build_args:
        - VERSION=${CI_COMMIT_TAG}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: release-packages
    image: golang:1.27-alpine
    commands:
      - apk add --no-cache make tar gzip zip
      - make release VERSION=${CI_COMMIT_TAG}