name: Go Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Go Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run test suite
        run: go test -v ./...
